[package]
name = "vlerv-mcp"
version.workspace = true
edition.workspace = true
description = "stdio MCP server that sends artifacts to paired Vlervtifacts devices"

[lib]
name = "vlerv_mcp"
path = "src/lib.rs"

[[bin]]
name = "vlerv-mcp"
path = "src/main.rs"

[dependencies]
# The whole networked stack. This crate adds NO transport, NO identity and NO
# path gate of its own — it is a second host for the same core the desktop app
# hosts, which is why `EventSink` / `HostCatalog` / `Dirs` exist.
vlerv-remote = { path = "../vlerv-remote" }
# Exact-pinned like the iroh stack next door: the MCP tool macros expand into
# rmcp's own router types, so a minor bump can change the generated schema.
rmcp = { version = "=3.1.4", features = ["server", "macros", "schemars", "transport-io"] }
# Same major as rmcp's own dependency: the derived `JsonSchema` impls must be
# the ones rmcp's `schema_for_input` consumes.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "io-std"] }

[dev-dependencies]
tempfile = "3"
