[package]
name = "src_tauri"
version.workspace = true
edition.workspace = true

[lib]
name = "src_tauri"
path = "src/lib.rs"

[[bin]]
name = "vlerv-app"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
percent-encoding = "2"
dirs = "5"
notify = "6"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
tauri-plugin-window-state = "2.4.1"
# Exact-pinned on purpose: the iroh API churned through 0.x, and a same-range
# bump can change request-gate behavior (see remote/beam.rs gate). Upgrades
# are deliberate migrations, not `cargo update` accidents.
iroh = "=1.0.3"
iroh-blobs = "=0.103.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
n0-future = "0.3"
bao-tree = "0.16"

# Share sheet (NSSharingServicePicker) bindings. Pinned to the same lines wry
# uses (objc2 0.6 / objc2-* 0.3) so there's only one NSView type universe.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSSharingService", "NSView", "NSResponder"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[features]
# E2E test hooks (echo log etc.); default OFF — gated to prevent prod abuse.
e2e-hooks = []
