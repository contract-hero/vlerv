[package]
name = "src_tauri"
version.workspace = true
edition.workspace = true

[lib]
name = "src_tauri"
path = "src/lib.rs"
# `staticlib` is what the generated Xcode project links on iOS; `cdylib` is
# the Android shape; `rlib` keeps the desktop binary and the tests linking
# against the same crate.
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vlerv-app"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
percent-encoding = "2"
dirs = "5"
notify = "6"
# `macos-private-api` must stay in the cross-platform table: `tauri-build`
# cross-checks `macOSPrivateApi: true` in tauri.conf.json against the `tauri`
# entry of `[dependencies]` and does not read target-specific tables. The
# feature only reaches `wry/transparent` + `wry/fullscreen`, which are inert
# on iOS, so it costs the iOS build nothing.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
# The whole networked stack — identity, endpoint, wire protocol, peer store,
# request gate and the RootSet path gate. Every iroh type stays inside it
# (pins included), so this crate holds the Tauri layer and nothing else.
vlerv-remote = { path = "../crates/vlerv-remote" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }

# ── macOS-only surface ──────────────────────────────────────────────────────
# Everything here fails to build for iOS, so it must never be a plain
# dependency:
#   * `tauri-plugin-drag`       — the `drag` crate has no iOS platform impl
#     (`unresolved import platform`), and a drag-out to Finder has no meaning
#     on a phone.
#   * `tauri-plugin-window-state` — there are no window geometries to persist.
#   * `objc2-app-kit`           — AppKit does not exist on iOS (UIKit does).
# Share sheet (NSSharingServicePicker) bindings are pinned to the same lines
# wry uses (objc2 0.6 / objc2-* 0.3) so there's only one NSView type universe.
[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-drag = "2"
tauri-plugin-window-state = "2.4.1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSSharingService", "NSView", "NSResponder"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
# Test-only: the deep-link tests and the two-endpoint integration tests mint
# real tickets and dial real endpoints. Same exact pins as `vlerv-remote`.
iroh = "=1.0.3"
iroh-blobs = "=0.103.0"

[features]
# E2E test hooks (echo log etc.); default OFF — gated to prevent prod abuse.
e2e-hooks = []
