[package]
name = "src_tauri"
version.workspace = true
edition.workspace = true

[lib]
name = "src_tauri"
path = "src/lib.rs"

[[bin]]
name = "vlerv-app"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
percent-encoding = "2"
url = "2"
dirs = "5"
notify = "6"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tauri-plugin-opener = "2"

# Share sheet (NSSharingServicePicker) bindings. Pinned to the same lines wry
# uses (objc2 0.6 / objc2-* 0.3) so there's only one NSView type universe.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSSharingService", "NSView", "NSResponder"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"

[features]
# E2E test hooks (echo log etc.); default OFF — gated to prevent prod abuse.
e2e-hooks = []
